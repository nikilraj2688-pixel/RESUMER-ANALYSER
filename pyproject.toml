[project]
name = "resumeiq"
version = "1.0.0"
description = "AI-Powered Resume Analyzer & Skill Gap Predictor"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-limiter>=3.5.0",
    "spacy>=3.7.0",
    "sentence-transformers>=2.2.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "firebase-admin>=6.2.0",
    "numpy>=1.24.0",
    "pyjwt>=2.8.0",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"
]

[tool.vercel]
entrypoint = "run:app"
