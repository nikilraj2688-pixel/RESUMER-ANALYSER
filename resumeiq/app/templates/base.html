<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ResumeIQ - AI Resume Analyzer & Skill Gap Predictor{% endblock %} </title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/print.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase App, Auth, Firestore & Storage SDKs (Compat/CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics-compat.js"></script>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      ResumeIQ
    </a>

    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/upload">Analyze Resume</a></li>
      <li><a href="/dashboard">Dashboard</a></li>
      <li><a href="/history">History</a></li>
    </ul>

    <div class="nav-actions">
      <button id="theme-toggle-btn" class="btn-icon" title="Toggle Light/Dark Theme">🌙</button>
      <div id="auth-actions">
        <a href="/login" class="btn btn-primary" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Main Body Content -->
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  <footer>
    <p>&copy; 2026 ResumeIQ. Connected to Firebase Project: <strong>resume--analyser-96</strong>.</p>
  </footer>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
